[tool.poetry]
name = "johnny-callback"
version = "0.1.0"
description = "Ansible callback plugin sending playbook results to johnny-api"
authors = ["Eelco Wesemann <6771014+sgaduuw@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
# The shipped artifact is the ansible collection (built via
# `ansible-galaxy collection build`), not a python package. Poetry
# is here only to manage dev tooling.
package-mode = false

[tool.poetry.dependencies]
# Source code stays Python-3.10-compatible (no 3.11+ syntax,
# `from __future__ import annotations` everywhere) so the
# installed collection runs on a Ubuntu-22.04 controller with
# ansible-core 2.16/2.17. Dev tooling pins ^3.11 because that's
# what ansible-core 2.19 (our test target) requires; the python
# constraint here only affects `poetry install`, not the
# shipped collection artifact.
python = "^3.11"

[tool.poetry.group.dev.dependencies]
pytest = "^9"
pytest-cov = "^7"
ruff = "^0.15"
# Bumping past 2.18 raises the controller Python floor to 3.11
# (was 3.10 on 2.16/2.17). Ubuntu 22.04 + ansible-core 2.16/2.17
# users are still source-compat at runtime — they just stop being
# covered by our CI matrix.
ansible-core = "^2.19"
# Used by TestDocumentationYaml to parse the plugin's DOCUMENTATION
# block. ansible-core pulls it transitively, but pin explicitly so
# the test doesn't break if that ever changes.
pyyaml = "^6"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
