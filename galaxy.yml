namespace: sgaduuw
name: johnny
version: 0.2.1
readme: README.md
authors:
  - sgaduuw
description: >
  Ansible callback plugin that POSTs playbook results (facts, events,
  stats) to a johnny-api instance for fleet-state reporting.
license_file: LICENSE
tags:
  - callback
  - notification
  - monitoring
  - reporting
repository: https://github.com/sgaduuw/johnny-callback
issues: https://github.com/sgaduuw/johnny-callback/issues
build_ignore:
  - .github
  - .gitignore
  - tests
  - pyproject.toml
  - uv.lock
  - "*.tar.gz"
  # uv defaults the venv to ./.venv (poetry kept it at
  # ~/.cache/pypoetry/virtualenvs); without this exclude the
  # collection tarball balloons by ~100 MB.
  - .venv
  # Local AI-workflow artefacts (trio + plans + brainstorm) and
  # the root-stub CLAUDE.md that imports them.
  - _claude
  - CLAUDE.md
  # Test / lint artefacts.
  - .coverage
  - .pytest_cache
  - .ruff_cache
