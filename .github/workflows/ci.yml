name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Floor (3.10) is what the plugin's pyproject.toml constraint
      # supports and matches the lowest ansible-core 2.16 install
      # base. Ceiling (3.14) is the latest stable. 3.12 in the
      # middle covers the version most distros' ansible packages
      # currently bundle. fail-fast: false so a single-version
      # regression doesn't mask its own diagnosis behind a sibling
      # job's abort.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install poetry
        run: pip install "poetry==1.8.5"

      - name: Cache poetry virtualenv
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check plugins/ tests/

      - name: Test
        run: poetry run pytest -v --cov=plugins/callback --cov-report=term --cov-fail-under=85

      - name: Build collection (smoke)
        run: poetry run ansible-galaxy collection build --output-path /tmp/
