name: CI

on:
  # CI is the pull-request gate: the test matrix (ruff + pytest-cov +
  # collection-build smoke) on every PR. It runs on NO branch push.
  # The Galaxy publish lives in publish.yml, triggered on the GitHub
  # Release (release: published), which trusts this PR gate and runs
  # no tests. (develop is a loose integration branch; main is the
  # PR-gated release branch.)
  pull_request:
    branches: [develop, main, "release/*", "hotfix/*"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # ansible-core 2.19 (our test target) requires controller
      # Python 3.11+, so the matrix floor is 3.11 (Debian 12
      # default). Cover every minor through the 3.14 ceiling so
      # any single-version drift surfaces in CI rather than in
      # the field. The plugin's source code stays
      # Python-3.10-compatible so a Ubuntu 22.04 + ansible-core
      # 2.16/2.17 controller can still install and run the
      # shipped collection; those users just aren't in the
      # matrix any more. fail-fast: false so a single-version
      # regression doesn't mask its diagnosis behind a sibling
      # job's abort.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check plugins/ tests/

      - name: Test
        run: uv run pytest -v --cov=plugins/callback --cov-report=term --cov-fail-under=85

      - name: Build collection (smoke)
        run: uv run ansible-galaxy collection build --output-path /tmp/
