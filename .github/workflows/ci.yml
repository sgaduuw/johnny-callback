name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # ansible-core 2.19 (our test target) requires controller
      # Python 3.11+, so the matrix floor moved up from 3.10 to
      # 3.12 (Debian 12 / Ubuntu 24.04 default). Ceiling 3.14 is
      # the latest stable. The plugin's source code stays
      # Python-3.10-compatible so a Ubuntu 22.04 + ansible-core
      # 2.16/2.17 controller can still install and run the
      # shipped collection — those users just aren't covered by
      # CI any more. fail-fast: false so a single-version
      # regression doesn't mask its diagnosis behind a sibling
      # job's abort.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install poetry
        run: pip install "poetry==1.8.5"

      - name: Cache poetry virtualenv
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check plugins/ tests/

      - name: Test
        run: poetry run pytest -v --cov=plugins/callback --cov-report=term --cov-fail-under=85

      - name: Build collection (smoke)
        run: poetry run ansible-galaxy collection build --output-path /tmp/
