name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"  # plugin must work on the floor version

      - name: Install poetry
        run: pip install "poetry==1.8.5"

      - name: Cache poetry virtualenv
        uses: actions/cache@v5
        with:
          path: ~/.cache/pypoetry/virtualenvs
          key: poetry-${{ runner.os }}-py3.10-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-py3.10-

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check plugins/ tests/

      - name: Test
        run: poetry run pytest -v --cov=plugins/callback --cov-report=term --cov-fail-under=85

      - name: Build collection (smoke)
        run: poetry run ansible-galaxy collection build --output-path /tmp/
