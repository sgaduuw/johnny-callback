name: Publish to Galaxy

# Triggers on a published GitHub release. galaxy.yml's `version`
# must match the release tag (without the leading 'v') for galaxy
# to accept the upload.
on:
  release:
    types: [published]
  # Manual trigger for retroactive publishes (e.g. publishing v0.1.0
  # after the workflow itself was added). Use:
  #   gh workflow run publish.yml -f tag=v0.1.0
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build + publish (e.g. v0.1.0)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install ansible-core
        run: pip install --no-cache-dir "ansible-core>=2.16"

      - name: Build collection
        run: ansible-galaxy collection build --output-path ./build

      - name: Publish to galaxy.ansible.com
        env:
          GALAXY_TOKEN: ${{ secrets.ANSIBLE_GALAXY_TOKEN }}
        run: |
          if [ -z "$GALAXY_TOKEN" ]; then
            echo "ANSIBLE_GALAXY_TOKEN secret not configured" >&2
            exit 1
          fi
          ansible-galaxy collection publish \
              ./build/sgaduuw-johnny-*.tar.gz \
              --token "$GALAXY_TOKEN"
